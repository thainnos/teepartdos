# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tlsecho"
BBFILE_PATTERN_meta-tlsecho = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tlsecho = "6"

LAYERDEPENDS_meta-tlsecho = "core"
LAYERSERIES_COMPAT_meta-tlsecho = "styhead"
