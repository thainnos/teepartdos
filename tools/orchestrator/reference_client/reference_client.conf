# TLS reference measurement client configuration
#
# Strict dependency-free key=value format.
# Run-specific identity and network placement are intentionally CLI arguments.

# TLS profile used by all A-E scenarios.
tls.ca_file=../certificates/server.crt
tls.server_name=tls-echo-server
tls.verify_peer=true
tls.verify_hostname=false
tls.strict_shutdown=false
tls.ciphersuite=TLS_AES_128_GCM_SHA256
tls.group=P-256
tls.signature_algorithm=ecdsa_secp256r1_sha256

# Fixed-duration reference measurement policy.
run.duration_s=300
run.probe_interval_ms=1000

# Present from the first version, but values are pilot parameters and should be
# frozen only after reference-client recommissioning and pilot measurements.
timeouts.tcp_connect_ms=5000
timeouts.tls_handshake_ms=5000
timeouts.io_ms=5000

# Echo payload. A single fixed payload size is intended for the final campaign.
payload.size_bytes=1024
payload.mode=fixed_pattern
payload.pattern_hex=a5
payload.seed=12345

# Resumption ticket/session handling policy for pilot evaluation.
# reuse_seed: decode a fresh SSL_SESSION object from one primed ticket for each probe;
#             keeps the 300 s run measurable across handshake failures, but reuses the same ticket.
# chain:      use a fresh server-issued ticket after each successful resumption; RFC-preferred
#             behavior, but the chain cannot continue after a failed handshake that yields no ticket.
resumption.session_policy=reuse_seed

socket.tcp_nodelay=true

# Record workload recovery behavior.
record.reconnect_on_failure=true
record.reconnect_backoff_ms=1000

output.directory=./results
output.csv_prefix=tls_reference
output.stdout_progress=true
