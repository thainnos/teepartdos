[campaign]
campaign_id = "C-tls-flood-medium-final-v1"
overall_campaign_id = "ABCDE-tls-flood-medium-final-v1"
campaign_type = "repeated"
description = "Final fixed-frequency medium-DoS TLS measurements, Scenario C"

[[runs]]
scenario = "C"
profile = "measurement"
reference_workload = "full-handshake"
